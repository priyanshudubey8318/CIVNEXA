version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: civnexa-mysql-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: civnexa_db
      MYSQL_USER: civnexa
      MYSQL_PASSWORD: civnexa_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - civnexa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: civnexa-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP Port
      - "8025:8025"   # Web UI Port
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: ""  # In-memory temporary store

volumes:
  civnexa_mysql_data:
