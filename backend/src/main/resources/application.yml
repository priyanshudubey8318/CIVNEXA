server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: civnexa-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civnexa_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CivnexaHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            trust: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:*}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}

civnexa:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    issuer: ${JWT_ISSUER:CIVNEXA}
  auth:
    public-registration-enabled: ${PUBLIC_REGISTRATION_ENABLED:true}
  otp:
    hmac-secret: ${CIVNEXA_OTP_HMAC_SECRET:civnexa_institutional_otp_hmac_secret_key_at_least_256_bits_for_sha256}
  bootstrap:
    admin:
      enabled: ${CIVNEXA_ENABLE_INITIAL_BOOTSTRAP:false}
      email: ${CIVNEXA_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${CIVNEXA_BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${CIVNEXA_BOOTSTRAP_ADMIN_NAME:Platform Administrator}
  ai:
    provider: ${CIVNEXA_AI_PROVIDER:GEMINI} # GEMINI or LOCAL
    api-key: ${CIVNEXA_AI_API_KEY:}
    model: ${CIVNEXA_AI_MODEL:gemini-2.5-flash}
    timeout-ms: ${CIVNEXA_AI_TIMEOUT_MS:10000}
  mail:
    enabled: ${CIVNEXA_MAIL_ENABLED:true}
    from: ${CIVNEXA_MAIL_FROM:no-reply@civnexa.edu}
  security:
    rate-limit:
      login:
        enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
        max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
        window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  storage:
    location: ${CIVNEXA_STORAGE_PATH:vault_storage}
    max-file-size: ${CIVNEXA_STORAGE_MAX_FILE_SIZE:26214400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin
    allow-credentials: true
